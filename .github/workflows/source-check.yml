name: Source integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check source snapshot and repository contents
        run: python3 scripts/check_repository.py
      - name: Check official device catalog records
        run: python3 scripts/check_catalog.py
      - name: Install Route A analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes llvm-18 clang-21
          mkdir -p "$RUNNER_TEMP/route-a-llvm-bin"
          ln -s /usr/bin/llvm-mc-18 "$RUNNER_TEMP/route-a-llvm-bin/llvm-mc"
          printf '%s\n' "$RUNNER_TEMP/route-a-llvm-bin" >> "$GITHUB_PATH"
          llvm-mc-18 --version
          clang-21 --version
          python3 -m venv "$RUNNER_TEMP/route-a-venv"
          "$RUNNER_TEMP/route-a-venv/bin/python" -m pip install --requirement requirements-route-a.txt
      - name: Record bounded native loader inventory diagnostics
        run: |
          python3 - <<'PY'
          import ctypes
          import json
          import os
          import shutil
          import subprocess
          import sys
          
          sys.path.insert(0, 'scripts')
          from route_a_zeta.zeta_elf_tools import BoundELF
          from route_a_zeta.zeta_llvm_oracle import _cleanup, _communicate_bounded
          
          libc = ctypes.CDLL(None)
          libc.gnu_get_libc_version.restype = ctypes.c_char_p
          print('LOADER_DIAGNOSTIC_LIBC=' + libc.gnu_get_libc_version().decode(), flush=True)
          program = BoundELF(shutil.which('llvm-mc'), executable=True)
          loader = None
          try:
              loader = BoundELF(program.elf['interpreter'], executable=True)
              print('LOADER_DIAGNOSTIC_IDENTITIES=' + json.dumps(
                  {'program': program.identity, 'elf': program.elf, 'loader': loader.identity}), flush=True)
              for held in (False, True):
                  for auxiliary in (False, True):
                      env = {'PATH': '/usr/bin:/bin', 'LC_ALL': 'C', 'LANG': 'C', 'NO_COLOR': '1'}
                      if auxiliary:
                          env['LD_SHOW_AUXV'] = '1'
                      argv = [loader.invocation, '--list', program.path]
                      executable = '/proc/self/fd/' + str(loader.fd) if held else loader.path
                      child = subprocess.Popen(argv, executable=executable, pass_fds=(program.fd, loader.fd),
                          stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                          start_new_session=True, env=env)
                      result = {'held_fd': held, 'show_auxiliary': auxiliary, 'argv': argv}
                      try:
                          stdout, stderr = _communicate_bounded(child, b'', 30)
                          result.update(returncode=child.returncode, stdout=stdout.decode('ascii'), stderr=stderr.decode('ascii'))
                      finally:
                          result['cleanup'] = _cleanup(child)
                          for stream in (child.stdin, child.stdout, child.stderr):
                              if stream is not None and not stream.closed:
                                  stream.close()
                          print('LOADER_DIAGNOSTIC_RESULT=' + json.dumps(result, sort_keys=True), flush=True)
                      cleanup = result['cleanup']
                      if not (cleanup['direct_child_reaped'] and cleanup['group_absent'] and not cleanup['errors']):
                          raise RuntimeError('loader diagnostic child did not finish cleanly')
                      if result.get('returncode') != 0:
                          raise RuntimeError('loader diagnostic child returned an error')
                      program.verify()
                      loader.verify()
          finally:
              if loader is not None:
                  loader.close()
              program.close()
          PY
      - name: Verify pinned pager patch application and reversal
        run: python3 scripts/prepare_route_a_xnu.py --output "$RUNNER_TEMP/route-a-xnu"
      - name: Prepare fixed public DarwinBoot parser and XNU boot argument declarations
        run: python3 scripts/probe_route_a_loader.py prepare-sources --output "$RUNNER_TEMP/route-a-loader-sources"
      - name: Prepare fixed public DarwinBoot allocation sources
        run: |
          cc --version
          python3 scripts/probe_route_a_allocation.py prepare-sources --output "$RUNNER_TEMP/route-a-allocation-sources"
      - name: Check Route A parsing, lowering, proof gates and extracted pager C
        env:
          ROUTE_A_FILESET_CLANG: /usr/bin/clang-21
        run: |
          ROUTE_A_XNU_PREPARED_DIR="$RUNNER_TEMP/route-a-xnu/tree" \
          ROUTE_A_LOADER_SOURCES="$RUNNER_TEMP/route-a-loader-sources" \
          ROUTE_A_ALLOCATION_SOURCES="$RUNNER_TEMP/route-a-allocation-sources" \
            "$RUNNER_TEMP/route-a-venv/bin/python" scripts/check_route_a.py
  pacga-fixture:
    name: Verify ordinary arm64 PACGA fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install fixed compiler family and QEMU fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential clang-18 lld-18 qemu-system-arm python3-venv
          python3 -m venv "$RUNNER_TEMP/route-a-pacga-venv"
          "$RUNNER_TEMP/route-a-pacga-venv/bin/python" -m pip install --requirement requirements-route-a.txt
      - name: Record tested source and installed tool versions
        run: |
          mkdir -p "$RUNNER_TEMP/route-a-pacga-ci"
          git rev-parse HEAD > "$RUNNER_TEMP/route-a-pacga-ci/checkout.txt"
          dpkg-query -W -f='${binary:Package} ${Version}\n' \
            clang-18 lld-18 qemu-system-arm > "$RUNNER_TEMP/route-a-pacga-ci/packages.txt"
          clang-18 --version
          ld.lld-18 --version
          qemu-system-aarch64 --version
      - name: Exercise PACGA encoding, C semantics, and rejection gates
        run: |
          "$RUNNER_TEMP/route-a-pacga-venv/bin/python" -m unittest discover \
            -s tests -p test_route_a_pacga.py -v 2>&1 \
            | tee "$RUNNER_TEMP/route-a-pacga-ci/unit-tests.log"
      - name: Compare native QARMA5 with ordinary cortex-a57 EL0 SVC
        run: |
          "$RUNNER_TEMP/route-a-pacga-venv/bin/python" -u scripts/route_a_pacga_probe/run.py \
            --output "$RUNNER_TEMP/route-a-pacga-ci/probe" \
            --clang clang-18 --lld ld.lld-18 --qemu qemu-system-aarch64 --timeout 60 \
            2>&1 | tee "$RUNNER_TEMP/route-a-pacga-ci/probe.log"
      - name: Report fixture scope and observed guest results
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'route-a-pacga-ci/probe/report.json'
          data = json.loads(report.read_text()) if report.exists() else {
              'complete': False, 'status': 'no_probe_report',
              'xnu_boot_verified': False, 'real_cache_proven': False, 'device_tested': False,
          }
          keys = ('complete', 'status', 'scope', 'results', 'error', 'message',
                  'xnu_boot_verified', 'real_cache_proven', 'device_tested')
          print('ROUTE_A_PACGA_FIXTURE_REPORT_JSON=' + json.dumps(
              {key: data[key] for key in keys if key in data}, sort_keys=True))
          PY
      - name: Preserve tool identities, fixture sources, ELF files, and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: route-a-pacga-fixture
          if-no-files-found: warn
          retention-days: 30
          path: ${{ runner.temp }}/route-a-pacga-ci/
  kernel-preparation:
    name: Prepare ordinary arm64 kernel sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check source preparation tools
        run: |
          python3 --version
          git --version
          clang --version
      - name: Fetch pinned public source objects
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          mkdir -p "$RUNNER_TEMP/route-a-sources"
          git init --bare "$RUNNER_TEMP/route-a-sources/unixnu.git"
          git -C "$RUNNER_TEMP/route-a-sources/unixnu.git" fetch --depth 1 \
            https://github.com/UniXNU/UniXNU.git \
            8542980d02b4d2cc5c32ee3542de1760b2562aac
          git init --bare "$RUNNER_TEMP/route-a-sources/xnu.git"
          git -C "$RUNNER_TEMP/route-a-sources/xnu.git" fetch --depth 1 \
            https://github.com/apple-oss-distributions/xnu.git \
            ac9718fb1af618d5ce8678d0dc6e8a58f252216f
      - name: Apply the selected source subset and compile the arm64 configuration probe
        run: |
          python3 scripts/prepare_route_a_kernel.py \
            --unixnu-repository "$RUNNER_TEMP/route-a-sources/unixnu.git" \
            --xnu-repository "$RUNNER_TEMP/route-a-sources/xnu.git" \
            --output "$RUNNER_TEMP/route-a-kernel-prepared" \
            --clang clang
      - name: Stage pinned public headers and first-pass kernel build inputs
        run: |
          python3 scripts/run_route_a_kernel_build.py stage \
            --unixnu-repository "$RUNNER_TEMP/route-a-sources/unixnu.git" \
            --prepared-kernel "$RUNNER_TEMP/route-a-kernel-prepared" \
            --work-dir "$RUNNER_TEMP/route-a-kernel-build"
      - name: Record source preparation scope and remaining build blockers
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "route-a-kernel-prepared/preparation-report.json"
          data = json.loads(report.read_text()) if report.exists() else {
              "status": "no_preparation_report",
              "kernel_compiled": False,
              "os_boot_verified": False,
          }
          print("ROUTE_A_KERNEL_REPORT_JSON=" + json.dumps(data, sort_keys=True))
          PY
      - name: Record first-pass source staging scope
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "route-a-kernel-build/.route-a/stage-report.json"
          data = json.loads(report.read_text()) if report.exists() else {"status": "no_stage_report"}
          summary = {key: data.get(key) for key in (
              "status", "error", "unixnu_commit", "xnu_commit", "driver_sha256",
              "prepared_source_inventory_sha256", "pre_build_fix_source_inventory_sha256", "staged_source_inventory_sha256",
              "full_upstream_profile_applied", "crypto_provider_selected",
              "complete_board_archive_closure", "kernel_compiled", "kernel_linked", "os_boot_verified",
          )}
          summary["source_count"] = len(data.get("sources", []))
          summary["header_record_count"] = len(data.get("restored_headers", []))
          summary["build_fix_count"] = len(data.get("build_fixes", {}).get("applied", []))
          summary["build_fix_manifest_sha256"] = data.get("build_fixes", {}).get("manifest_sha256")
          print("ROUTE_A_KERNEL_STAGE_SUMMARY_JSON=" + json.dumps(summary, sort_keys=True))
          PY
      - name: Preserve preparation reports and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: route-a-kernel-preparation
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/route-a-kernel-prepared/preparation-report.json
            ${{ runner.temp }}/route-a-kernel-prepared/selected-patches.json
            ${{ runner.temp }}/route-a-kernel-prepared/source-inventory.json
            ${{ runner.temp }}/route-a-kernel-prepared/build-environment.json
            ${{ runner.temp }}/route-a-kernel-prepared/compiler-probes/*.stderr
            ${{ runner.temp }}/route-a-kernel-prepared/compiler-probes/macros.txt
            ${{ runner.temp }}/route-a-kernel-build/.route-a/stage-report.json
            ${{ runner.temp }}/route-a-kernel-build/.route-a/stage.log
            ${{ runner.temp }}/route-a-kernel-build/.route-a/staged-source-inventory.json
            ${{ runner.temp }}/route-a-kernel-build/.route-a/pre-build-fix-source-inventory.json
            ${{ runner.temp }}/route-a-kernel-build/.route-a/build-fixes/
